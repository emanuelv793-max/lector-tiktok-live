name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m pip install pip-audit==2.10.1 bandit==1.9.4

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Analyze Python code
        run: python -m bandit -q -r app.py -ll

      - name: Run security tests
        run: python -m unittest discover -s tests -v

      - name: Compile-check Python
        run: python -m py_compile app.py
